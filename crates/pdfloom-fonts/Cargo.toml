[package]
name = "pdfloom-fonts"
description = "Font registry: built-in catalog, system fonts, name resolution and fallback"
categories = ["text-processing"]
keywords = ["pdf", "pdfua", "accessibility", "tagged", "unicode"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pdfloom-font = { workspace = true }
thiserror = "2"

# Per-user font cache location for `pdfloom fonts install`. Native
# only: the browser engine never looks at the cache.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"

[lints]
workspace = true

# NOTE: the font files live at <workspace>/fonts/vendor (outside this
# crate directory, so they are never packaged into the .crate). Runtime
# resolution: repo checkouts find them relative to CARGO_MANIFEST_DIR;
# installed-from-crates.io builds fall back to system fonts or
# PDFLOOM_FONTS_DIR (see fonts_dir() in src/lib.rs).
