[package]
# Distributed via wasm-pack / npm, not crates.io.
publish = false
name = "pdfloom-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings: the in-browser build engine for PDFloom Studio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfloom = { path = "../pdfloom", version = "0.1.0", default-features = false }
pdfloom-def = { path = "../pdfloom-def", version = "0.1.0" }
pdfloom-parse = { path = "../pdfloom-parse", version = "0.1.0" }
pdfloom-profile = { path = "../pdfloom-profile", version = "0.1.0" }
pdfloom-render = { path = "../pdfloom-render", version = "0.1.0" }
pdfloom-validate = { path = "../pdfloom-validate", version = "0.1.0" }
pdfloom-fonts = { path = "../pdfloom-fonts", version = "0.1.0" }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
