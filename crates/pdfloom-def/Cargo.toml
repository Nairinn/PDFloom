[package]
name = "pdfloom-def"
description = "pdfloom-doc v1 document definitions: the editor/config format and its builder"
categories = ["text-processing"]
keywords = ["pdf", "pdfua", "accessibility", "tagged", "unicode"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pdfloom = { path = "../pdfloom", version = "0.1.0", default-features = false }
pdfloom-core = { workspace = true }
pdfloom-profile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
flate2 = "1"

[lints]
workspace = true
