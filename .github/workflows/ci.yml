name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # on-demand re-runs from the Actions tab

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch optional CJK fonts
        run: bash scripts/fetch-cjk-fonts.sh

      - name: Build (excluding Python extension)
        run: cargo build --workspace --exclude pdfloom-py

      - name: Test
        run: cargo test --workspace --exclude pdfloom-py

      - name: Clippy (blocking)
        run: cargo clippy --workspace --exclude pdfloom-py --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint commit messages (Conventional Commits)
        if: matrix.os == 'ubuntu-latest'
        run: |
          RANGE="${{ github.event.pull_request.base.sha || 'origin/main~50' }}..HEAD"
          git log --format='%s' "$RANGE" 2>/dev/null |
          grep -vE '^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)(\(.+\))?: .+$' |
          grep -q . && { echo "Non-conventional commit subjects found:"; git log --format='%s' "$RANGE" | grep -vE '^(feat|fix|docs|chore|refactor|test|style|perf|build|ci|revert)(\(.+\))?: .+$' | head; exit 1; } || echo "commit style OK"

  deny:
    name: cargo deny (licenses, bans, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: License / ban / advisory gate
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --exclude pdfloom-py

      # The MPL-2.0 exceptions in deny.toml are scoped to the uniffi
      # crates of the optional bindings. If any of them ever reaches
      # the core API or the browser engine, that is a design bug: this
      # guard fails the build instead of relying on review alone.
      - name: MPL crates must not reach pdfloom or pdfloom-wasm
        run: |
          if cargo tree -e normal -p pdfloom --target wasm32-unknown-unknown | grep -i uniffi; then
            echo "pdfloom's tree contains an uniffi (MPL-2.0) crate" >&2
            exit 1
          fi
          if cargo tree -e normal -p pdfloom-wasm --target wasm32-unknown-unknown | grep -i uniffi; then
            echo "pdfloom-wasm's tree contains an uniffi (MPL-2.0) crate" >&2
            exit 1
          fi

  verapdf:
    name: veraPDF gate (UA-1 + UA-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch optional CJK fonts
        run: bash scripts/fetch-cjk-fonts.sh

      - name: Generate every tests/output fixture
        run: cargo test --workspace --exclude pdfloom-py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add wasm32 target + wasm-pack (pinned release binary)
        run: |
          rustup target add wasm32-unknown-unknown
          VER=v0.13.1
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/rustwasm/wasm-pack/releases/download/$VER/wasm-pack-$VER-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 \
              "wasm-pack-$VER-x86_64-unknown-linux-musl/wasm-pack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          wasm-pack --version

      # Byte-identical gate: the golden fixture (image inlined as a
      # data: URL for the browser world) must build to the same bytes
      # through native code and the WASM engine in Node. The outputs go
      # to tests/output/ so the veraPDF gate below validates them too.
      - name: WASM parity (byte-identical native vs in-browser engine)
        run: |
          wasm-pack build crates/pdfloom-wasm --target nodejs \
            --out-dir pkg-nodejs --out-name pdfloom
          node scripts/wasm-parity.mjs

      - name: Install veraPDF (pinned to 1.30.2)
        run: |
          mkdir -p tools/verapdf
          # Pinned, not "latest": the README cites 1.30.2 and the gate
          # must validate against the same version every run.
          curl -fsSL -o /tmp/verapdf-installer.zip \
            "https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.2-installer.zip"
          unzip -q /tmp/verapdf-installer.zip -d /tmp/verapdf-dl
          # Panel FQNs and pack names must match the installer's own
          # recorded auto-install XML exactly, or izpack fails silently.
          cat > /tmp/verapdf-dl/auto-install.xml <<'XML'
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
          <!-- github.workspace (not a hardcoded repo path) so this keeps
               working before and after any GitHub repo rename. -->
          <installpath>${{ github.workspace }}/tools/verapdf</installpath>
          </com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
          <pack index="0" name="veraPDF GUI" selected="true"/>
          <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
          <pack index="2" name="veraPDF Validation model" selected="true"/>
          <pack index="3" name="veraPDF Documentation" selected="true"/>
          <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          JAR=$(find /tmp/verapdf-dl -name 'verapdf-izpack-installer-*.jar' | head -1)
          java -jar "$JAR" /tmp/verapdf-dl/auto-install.xml
          # Hard version gate: the pinned download must be exactly 1.30.2.
          tools/verapdf/verapdf --version | head -1 | grep -qx 'veraPDF 1.30.2' \
            || { echo "veraPDF version mismatch (expected 1.30.2)" >&2; exit 1; }
          tools/verapdf/verapdf --version

      - name: Validate every generated PDF (fail on any failed check)
        run: bash scripts/verapdf-gate.sh
